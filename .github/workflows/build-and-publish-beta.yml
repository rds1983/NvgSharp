name: Build & Publish Beta

on:
    push:
        paths:
            - 'src/**'
            - 'build/**'
            - 'samples/**'
    workflow_dispatch:

jobs:
  BuildAndPublish:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
    - name: Install efscriptgen
      run: dotnet tool install --global efscriptgen
    - name: Install mgfxc
      run: dotnet tool install --global dotnet-mgfxc --version 3.8.1.303
    - name: Generate effects build scripts
      run: efscriptgen.exe src/XNA/Resources
    - name: Build DirectX effects
      run: src/XNA/Resources/MonoGameDX11/compile_all.bat
    - name: Build OpenGL effects
      run: src/XNA/Resources/MonoGameOGL/compile_all.bat
    - name: Build NvgSharp.MonoGame
      run: dotnet build build\NvgSharp.MonoGame.sln --configuration Release
    - name: Build NvgSharp.PlatformAgnostic
      run: dotnet build build\NvgSharp.PlatformAgnostic.sln --configuration Release
    - name: Test
      run: dotnet test build\NvgSharp.MonoGame.sln
