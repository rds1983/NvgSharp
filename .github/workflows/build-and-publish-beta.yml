name: Build & Publish Beta

on:
    push:
        paths:
            - 'src/**'
            - 'build/**'
            - 'samples/**'
    workflow_dispatch:

jobs:
  BuildAndPublish:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
    - name: Build NvgSharp
      run: dotnet build build\NvgSharp.PlatformAgnostic.sln --configuration Release
    - name: Install mgfxc
      run: dotnet tool install --global dotnet-mgfxc --version 3.8.1.303
    - name: Build effects
      run: src/XNA/Resources/buildMonoGame.bat
    - name: Build NvgSharp.MonoGame
      run: dotnet build build\NvgSharp.MonoGame.sln --configuration Release
    - name: Test
      run: dotnet test build\NvgSharp.MonoGame.sln
    - name: Install NuGet
      uses: NuGet/setup-nuget@v1